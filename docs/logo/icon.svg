<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Disco FPV app icon (adaptive icon layout: 108 units, safe circle r=33). BSD-3-Clause. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4566"/>
      <stop offset="0.62" stop-color="#0F2A40"/>
      <stop offset="1" stop-color="#081723"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#sky)"/>
  <!-- HUD: horizon with a gap, its end ticks, and the pitch marks -->
  <g stroke="#FF8C1A" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M24 66 H44 M64 66 H84"/>
    <path d="M24 66 V70 M84 66 V70"/>
  </g>
  <g stroke="#FF8C1A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M42 75 H48 M60 75 H66"/>
  </g>
  <!-- the flying wing, seen from above, flying up the screen -->
  <path fill="#F4F7FA" d="M54 28 C57.2 28 59.6 31 60.6 35 L85 54.5 L84.2 58.6 L62 54.2 L61 62.5 L47 62.5 L46 54.2 L23.8 58.6 L23 54.5 L47.4 35 C48.4 31 50.8 28 54 28 Z"/>
  <!-- twin fins and the pusher propeller -->
  <g stroke="#0F2A40" stroke-width="1.3" stroke-linecap="round">
    <path d="M50.5 50 V61 M57.5 50 V61"/>
  </g>
  <path d="M48 65.2 H60" stroke="#F4F7FA" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <!-- the FPV camera in the nose -->
  <circle cx="54" cy="32.6" r="1.9" fill="#36D1FF"/>
</svg>
