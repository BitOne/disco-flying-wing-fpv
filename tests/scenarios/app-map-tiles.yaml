name: Disco FPV moving map over map tiles
description: >
  Needs `make fake`, `make video` and `make emu`. The settings choose a map
  background (OpenStreetMap, IGN aerial photos of France, or any XYZ URL,
  for example a satellite layer with your own key); here the custom URL
  points at the test runner's local tile server (no real map service in
  the tests), through the emulator's host address. The moving map then
  draws the tiles under its trail, and the settings download an area ahead
  for flying without network.
app:
  package: io.github.bitone.discofpv
  activity: .MainActivity
steps:
  - shell: run-as io.github.bitone.discofpv rm -rf shared_prefs/hud.xml shared_prefs/settings.xml shared_prefs/last_fix.xml shared_prefs/map_screen.xml files/tiles
  - send: [drone_link ok, fail gps off, battery 64, home 45.1885 5.7245 300, gps 45.1890 5.7250 350,
      satellites 12, circle]
  - restart_app
  - expect_texts: ["DISCO-FAKE01 (DISCO): CONNECTED"]
    timeout: 20000
  - tap_text: Settings
  - tap_text: "Map: none"
  # the map screen: the background from a list, with what each one allows
  - tap_text: "Map background: none"
  - tap_text: OpenStreetMap
  - expect_texts: ["Map background: OpenStreetMap", "terms don't allow downloading"]
  - tap_text: "Map background: OpenStreetMap"
  - tap_text: custom URL
  # a custom URL asks for its URL straight away (typed once the dialog is up)
  - wait: 1500
  - shell: "input text 'http://10.0.2.2:8091/{z}/{x}/{y}.png'"
  - tap_text: OK
  - expect_texts: ["Map background: custom URL", "Custom map tiles URL: http://10.0.2.2:8091/{z}/{x}/{y}.png"]
  - back
  - expect_texts: ["Map: custom URL"]
  - back
  - tap_text: Flight view
  - expect_texts: [CIRCLING]
  - send: [button b]
  - expect_texts: ["HUD MAP"]
  - expect_http: { url: "http://127.0.0.1:8091/stats", matches: "served [1-9]" }
  - wait: 2000
  - screenshot: map-tiles
  - send: [button b]
  # an area ahead, for the field without network (the last position, 1.5 km)
  - back
  - tap_text: Settings
  - tap_text: "Map: custom URL"
  # the preview, centred on the Disco's last position, and its area
  - tap_text: The Disco
  - expect_texts: ["Around the Disco's last position: 45.18"]
  - expect_http: { url: "http://127.0.0.1:8091/stats", matches: "served [1-9]" }
  - tap_id: map_zoom_out
  - wait: 2000
  - screenshot: map-preview
  # a broken or hostile tile server (an image decoding to 256 MB, then no
  # image at all): nothing drawn there, the app stays up (crashes fail the run)
  - expect_http: { url: "http://127.0.0.1:8091/mode/huge", matches: "mode huge" }
  - tap_id: map_zoom_out
  - wait: 4000
  - expect_http: { url: "http://127.0.0.1:8091/mode/junk", matches: "mode junk" }
  - tap_id: map_zoom_out
  - wait: 4000
  - expect_texts: ["Around the Disco's last position: 45.18"]
  - expect_http: { url: "http://127.0.0.1:8091/mode/normal", matches: "mode normal" }
  - tap_id: map_zoom_in
  - tap_id: map_zoom_in
  - tap_text: Download this area
  - expect_texts: ["of 2000 tiles around 45.18"]
    timeout: 30000
  - expect_texts: ["Downloaded 2000 of 2000 tiles"]
    timeout: 180000
  # typed coordinates: a typo keeps the dialog open, then a map link
  - tap_text: "Coordinates…"
  - wait: 1500
  - shell: "input text 'Grenoble'"
  - tap_text: OK
  - expect_texts: ["Not a position"]
  - tap_text: Cancel
  - tap_text: "Coordinates…"
  - wait: 1500
  - shell: "input text 'geo:45.2,5.73'"
  - tap_text: OK
  - expect_texts: ["Around 45.20000, 5.73000"]
  # a download can be stopped half way: the tiles fetched so far stay (a
  # slow tile server leaves the time to tap Stop)
  - expect_http: { url: "http://127.0.0.1:8091/delay/100", matches: "delay 100" }
  - tap_text: Download this area
  - expect_texts: ["of 2000 tiles around 45.20000", "Stop the download"]
    timeout: 30000
  - tap_text: Stop the download
  - expect_texts: ["Download stopped:", "tiles kept around 45.20000", "Download this area"]
    timeout: 15000
  - screenshot: map-download-stopped
  - expect_http: { url: "http://127.0.0.1:8091/delay/0", matches: "delay 0" }
  - tap_text: Download this area
  - expect_texts: ["Downloaded 2000 of 2000 tiles around 45.20000, 5.73000: done"]
    timeout: 180000
  # this phone's position: a test GPS provider stands in for the phone's GPS
  - shell: pm grant io.github.bitone.discofpv android.permission.ACCESS_FINE_LOCATION
  - shell: appops set com.android.shell android:mock_location allow
  - shell: cmd location providers add-test-provider gps
  - shell: cmd location providers set-test-provider-enabled gps true
  - shell: cmd location providers set-test-provider-location gps --location 45.21,5.74
  - tap_text: This phone
  - expect_texts: ["Around this phone: 45.21000, 5.74000"]
    timeout: 30000
  - wait: 2000
  - screenshot: map-phone
  - shell: cmd location providers remove-test-provider gps
  - shell: pm revoke io.github.bitone.discofpv android.permission.ACCESS_FINE_LOCATION
  - shell: run-as io.github.bitone.discofpv rm -rf shared_prefs/settings.xml shared_prefs/last_fix.xml shared_prefs/map_screen.xml files/tiles
