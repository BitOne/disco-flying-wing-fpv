name: Disco FPV headset view shows live video in both eyes
description: >
  Needs `make fake`, `make video` and `make emu`. Opens the side-by-side
  headset view (GsdkHmdView, lens-corrected) and checks live video in the
  left and right eye areas, that both eyes show the same picture (the
  right eye is the left one shifted), and that the HUD text is present in
  the bands above and below the video in each eye. The HUD is drawn inside
  the GL view, so it is checked on the screenshot only. Regions are
  fractions of the 2400x1080 landscape screen.
app:
  package: io.github.bitone.discofpv
  activity: .MainActivity
steps:
  - send: [battery 64, altitude 33.3, flying_state flying]
  - restart_app
  - expect_texts: ["DISCO-FAKE01 (DISCO): CONNECTED"]
    timeout: 20000
  - tap_text: Headset view
  - expect_video:
      region: [0.12, 0.3, 0.45, 0.65]
      min_contrast: 30
      min_change: 0.002
    timeout: 30000 # first run after an emulator boot can take longer
  - expect_video:
      region: [0.55, 0.3, 0.88, 0.65]
      min_contrast: 30
      min_change: 0.002
    timeout: 15000
  - expect_stereo:
      region: [0.10, 0.17, 0.47, 0.82] # left eye, video and HUD bands
      max_diff: 8
      min_contrast: 30
  # HUD lines: top band (flight data), bottom band (systems), each eye
  - expect_image: { region: [0.16, 0.19, 0.41, 0.25], min_contrast: 15 }
  - expect_image: { region: [0.12, 0.75, 0.45, 0.80], min_contrast: 15 }
  - expect_image: { region: [0.59, 0.19, 0.84, 0.25], min_contrast: 15 }
  - expect_image: { region: [0.55, 0.75, 0.88, 0.80], min_contrast: 15 }
  - screenshot: headset-view
